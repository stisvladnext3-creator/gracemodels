# Example for a separate Nginx + PHP-FPM hosting configuration.
# Replace paths, domain and the PHP-FPM socket with your hosting values.
server {
    listen 80;
    server_name example.com;
    root /home/user/public_html;
    index index.php;
    client_max_body_size 20m;

    location ~ ^/(app|public|storage|backup|worker|drizzle|scripts|tests|tools|dist|node_modules)(/|$) { deny all; }
    location ~ ^/(config(?:\.example)?\.php|install-key\.php)$ { deny all; }
    location ~ /\. { deny all; }

    location ~ ^/(index|install)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location / { rewrite ^ /index.php last; }

    # Configure the HTTPS certificate in your hosting panel.
}
