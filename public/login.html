<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f5f5ef">
  <title>Вход в студию агентства</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/login.css">
  <script type="module" src="/login.js"></script>
</head>
<body>
  <main class="login-layout">
    <section class="login-form-panel">
      <a class="login-wordmark" href="/">STUDIO<span>MODEL MANAGEMENT</span></a>
      <div class="login-main">
        <p class="eyebrow"><span></span>ПРОСТРАНСТВО АГЕНТСТВА</p>
        <h1>С возвращением.</h1>
        <p class="intro">Ваши модели, новые знакомства<br>и рабочие задачи — в одном месте.</p>
        <form id="login-form">
          <label for="login">Логин</label>
          <input id="login" name="login" type="text" required maxlength="100" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
          <label for="password">Пароль</label>
          <div class="password-field">
            <input id="password" name="password" type="password" required maxlength="512" autocomplete="current-password">
            <button id="show-password" type="button" aria-label="Показать пароль" aria-pressed="false">Показать</button>
          </div>
          <p class="remember"><span>◉</span>Вход запоминается на этом устройстве.</p>
          <div id="login-error" role="alert"></div>
          <button class="submit" type="submit"><span>Войти в студию</span><span aria-hidden="true">↗</span></button>
        </form>
        <a class="back-link" href="/">← Вернуться на сайт</a>
      </div>
      <footer>ЗАКРЫТАЯ ПАНЕЛЬ АГЕНТСТВА <span>● SECURE ACCESS</span></footer>
    </section>
    <aside class="login-visual" aria-hidden="true">
      <img src="/images/woman-02.jpg" alt="">
      <div class="visual-caption"><span>BEHIND EVERY FACE,<br>A STORY OF ITS OWN.</span><span>↗</span></div>
    </aside>
  </main>
</body>
</html>
